sample:
  name: Hello console
  description: |
    Minimal bring-up sample that prints to the console (UART on nx15,
    USB CDC on nx40) via printk and emits LOG messages to the same
    console.
tests:
  sample.korlinx.hello:
    harness: console
    platform_allow:
      - nx15/nrf54l15/cpuapp
      - nx40/nrf52840
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Korlinx NX hello sample"
        - "printk tick #[0-9]+"
