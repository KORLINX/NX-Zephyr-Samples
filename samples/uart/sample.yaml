sample:
  name: UART smoke test
  description: |
    UART smoke test. Emits a TX heartbeat over the board
    console UART and echoes back any received bytes, so both directions of
    the UART can be verified with a serial terminal at 115200 8N1.
tests:
  sample.korlinx.uart:
    harness: console
    platform_allow:
      - nx15/nrf54l15/cpuapp
      - nx40/nrf52840
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Korlinx NX UART test"
        - "uart alive #[0-9]+"
